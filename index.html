<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cafeyn Group Solutions — Documentation</title>
    <link rel="alternate" hreflang="fr" href="https://cafeynfr.github.io/Cafeyn.Group.Solutions-Documentations/fr/" />
    <link rel="alternate" hreflang="en" href="https://cafeynfr.github.io/Cafeyn.Group.Solutions-Documentations/en/" />
    <link rel="alternate" hreflang="x-default" href="https://cafeynfr.github.io/Cafeyn.Group.Solutions-Documentations/" />
    <script>
      // Redirige vers la langue mémorisée (sélecteur FR/EN), sinon celle du navigateur (fr → FR, sinon EN).
      (function () {
        var lang;
        try { lang = localStorage.getItem('cgs-docs-lang'); } catch (e) {}
        if (lang !== 'fr' && lang !== 'en') {
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          lang = /^fr\b/i.test(nav) ? 'fr' : 'en';
        }
        location.replace('./' + lang + '/' + location.search + location.hash);
      })();
    </script>
    <style>
      body{margin:0;font:17px/1.55 -apple-system,"Segoe UI",sans-serif;background:#fbfbfa;color:#18181a;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
      @media (prefers-color-scheme:dark){body{background:#131214;color:#f1f0ee}}a{color:#fa1d00}
    </style>
  </head>
  <body>
    <p><a href="./fr/" hreflang="fr" lang="fr">Français</a> · <a href="./en/" hreflang="en">English</a></p>
  </body>
</html>
